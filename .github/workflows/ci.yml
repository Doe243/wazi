name: CI

on:
  push:
  pull_request:

jobs:
  qualite:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit de sécurité des dépendances
        run: composer audit

      - name: Style de code
        run: composer cs

      - name: Analyse statique
        run: composer stan

      - name: Règles de dépendance entre couches
        run: composer deptrac

      - name: Tests
        run: composer test
